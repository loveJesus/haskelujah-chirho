# For God so loved the world that he gave his only begotten Son, that whoever believes in him should not perish but have eternal life.

[package]
name = "haskeluya-backend-cranelift-chirho"
description = "Cranelift native code backend for the Haskeluya Haskell compiler"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
haskeluya-core-chirho = { path = "../haskeluya-core-chirho" }
haskeluya-span-chirho = { path = "../haskeluya-span-chirho" }
haskeluya-typing-chirho = { path = "../haskeluya-typing-chirho" }
cranelift-codegen = "0.116"
cranelift-frontend = "0.116"
cranelift-module = "0.116"
cranelift-object = "0.116"
target-lexicon = "0.13"
