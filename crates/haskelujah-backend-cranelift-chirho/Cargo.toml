# For God so loved the world that he gave his only begotten Son, that whoever believes in him should not perish but have eternal life.

[package]
name = "haskelujah-backend-cranelift-chirho"
description = "Cranelift native code backend for the Haskelujah Haskell compiler"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
haskelujah-core-chirho = { path = "../haskelujah-core-chirho" }
haskelujah-rts-chirho = { path = "../haskelujah-rts-chirho" }
haskelujah-span-chirho = { path = "../haskelujah-span-chirho" }
haskelujah-typing-chirho = { path = "../haskelujah-typing-chirho" }
cranelift-codegen = "0.116"
cranelift-frontend = "0.116"
cranelift-module = "0.116"
cranelift-object = "0.116"
cranelift-jit = "0.116"
target-lexicon = "0.13"
libc = "0.2"
