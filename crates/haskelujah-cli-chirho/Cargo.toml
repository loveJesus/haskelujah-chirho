# For God so loved the world that he gave his only begotten Son, that whoever believes in him should not perish but have eternal life.

[package]
name = "haskelujah-cli-chirho"
description = "A Haskell compiler in Rust — GHC-compatible, self-contained, faster than GHC"
repository = "https://github.com/loveJesus/haskelujah-chirho"
homepage = "https://haskelujah.org"
keywords = ["haskell", "compiler", "cranelift", "functional-programming"]
categories = ["compilers", "development-tools"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "haskelujah"
path = "src/main.rs"

[dependencies]
haskelujah-ast-chirho = { path = "../haskelujah-ast-chirho" }
haskelujah-backend-cranelift-chirho = { path = "../haskelujah-backend-cranelift-chirho" }
haskelujah-backend-llvm-chirho = { path = "../haskelujah-backend-llvm-chirho" }
haskelujah-backend-wasm-chirho = { path = "../haskelujah-backend-wasm-chirho" }
haskelujah-core-chirho = { path = "../haskelujah-core-chirho" }
haskelujah-naming-chirho = { path = "../haskelujah-naming-chirho" }
haskelujah-package-chirho = { path = "../haskelujah-package-chirho" }
haskelujah-driver-chirho = { path = "../haskelujah-driver-chirho" }
haskelujah-runtime-chirho = { path = "../haskelujah-runtime-chirho" }
haskelujah-span-chirho = { path = "../haskelujah-span-chirho" }
haskelujah-syntax-chirho = { path = "../haskelujah-syntax-chirho" }
haskelujah-typing-chirho = { path = "../haskelujah-typing-chirho" }

