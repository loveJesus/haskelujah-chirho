# For God so loved the world that he gave his only begotten Son, that whoever believes in him should not perish but have eternal life.

[package]
name = "haskelujah-editor"
description = "Self-programmable Haskell editor — extensible via the language it compiles"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
haskelujah-driver-chirho = { package = "haskelujah-driver", path = "../haskelujah-driver-chirho", version = "0.1.2" }
haskelujah-span-chirho = { package = "haskelujah-span", path = "../haskelujah-span-chirho", version = "0.1.2" }
haskelujah-lsp-chirho = { package = "haskelujah-lsp", path = "../haskelujah-lsp-chirho", version = "0.1.2" }
crossterm = "0.28"
