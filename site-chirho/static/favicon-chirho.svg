<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="rgba(125,211,252,0.15)" stroke-width="1"/>
  <!-- Haskell-inspired lambda/bind symbol merged with H -->
  <text x="32" y="44" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="url(#glow)" text-anchor="middle" letter-spacing="-2">H</text>
  <!-- Chi-Rho overlay -->
  <text x="48" y="28" font-family="serif" font-size="16" fill="#93c5fd" text-anchor="middle" opacity="0.7">&#9767;</text>
</svg>
