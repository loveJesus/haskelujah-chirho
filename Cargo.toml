# For God so loved the world that he gave his only begotten Son, that whoever believes in him should not perish but have eternal life.

[workspace]
resolver = "3"
members = [
  "crates/haskelujah-ast-chirho",
  "crates/haskelujah-backend-llvm-chirho",
  "crates/haskelujah-backend-wasm-chirho",
  "crates/haskelujah-cli-chirho",
  "crates/haskelujah-diagnostics-chirho",
  "crates/haskelujah-driver-chirho",
  "crates/haskelujah-naming-chirho",
  "crates/haskelujah-parser-chirho",
  "crates/haskelujah-runtime-chirho",
  "crates/haskelujah-span-chirho",
  "crates/haskelujah-syntax-chirho",
  "crates/haskelujah-test-harness-chirho",
  "crates/haskelujah-typing-chirho",
  "crates/haskelujah-core-chirho",
  "crates/haskelujah-package-chirho",
  "crates/haskelujah-incremental-chirho",
  "crates/haskelujah-backend-cranelift-chirho",
  "crates/haskelujah-backend-jvm-chirho",
  "crates/haskelujah-backend-beam-chirho",
  "crates/haskelujah-rts-chirho",
  "crates/haskelujah-th-chirho",
  "crates/haskelujah-mcp-chirho",
  "crates/haskelujah-lsp-chirho",
  "crates/haskelujah-editor-chirho",
  "crates/haskelujah-gui-chirho",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93.0"
version = "0.1.35"

# Generated executables call this runtime in their hot loops, even when the
# compiler itself is a debug build. Keep debug information and assertions, but
# optimize the native RTS so end-to-end scale tests exercise generated code
# rather than an unoptimized Rust hash table on every thunk-entry check.
[profile.dev.package.haskelujah-rts]
opt-level = 2
